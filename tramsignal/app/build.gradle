plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diego.tramsignal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.diego.tramsignal'
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
